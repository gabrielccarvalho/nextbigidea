name: weekly-pipeline
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      since_days:
        description: "Days of history to fetch — raise for a one-off backfill run"
        required: false
        default: "7"
      usd_cap:
        description: "Monthly USD spend cap — a 365-day backfill needs ~$4 headroom"
        required: false
        default: "5"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Playwright install: the registered adapters (HN, Stack Exchange,
      # GitHub) are plain HTTP. Only the unregistered X/LinkedIn scrapers ever
      # needed a browser.
      - name: Run pipeline
        id: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_MONTHLY_USD_CAP: ${{ inputs.usd_cap || '5' }}
          PIPELINE_SINCE_DAYS: ${{ inputs.since_days || '7' }}
          SOURCE_HACKERNEWS: "true"
          SOURCE_STACKEXCHANGE: "true"
          SOURCE_GITHUB: "true"
          # The workflow's own token is enough for /search/issues (30 req/min).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: lifts the Stack Exchange quota from 300 to 10,000 req/day.
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
        run: pnpm --filter @workspace/pipeline start
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly pipeline failed: run ${context.runId}`,
              body: `The weekly demand pipeline failed. See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["pipeline-failure"],
            });
